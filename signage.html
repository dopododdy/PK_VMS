<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8" />
    <title>หน้าจอโฆษณา | PK-VMS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100vw; height: 100vh;
            overflow: hidden;
            background: #020617;
            font-family: "Sarabun", sans-serif;
            color: #e2e8f0;
        }

        /* ===== LAYOUT ===== */
        #signage-root {
            display: flex;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
        }

        #row-top {
            display: flex;
            flex: 0 0 86%;
            min-height: 0;
        }

        /* Section 1 – Video */
        #sec-video {
            flex: 0 0 56%;
            display: flex;
            flex-direction: column;
            background: #000;
            overflow: hidden;
        }
        #video-area {
            width: 100%;
            aspect-ratio: 16 / 9;
            position: relative;
            flex-shrink: 0;
            background: #000;
        }
        #video-area iframe,
        #video-area video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
            object-fit: cover;
        }
        #video-placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: #334155;
        }
        #video-placeholder .icon { font-size: 3rem; }
        #video-placeholder .msg { font-size: 1rem; font-weight: 600; }
        
        /* Video Controls Overlay */
        #video-controls {
            position: absolute;
            bottom: 15px;
            right: 15px;
            z-index: 50;
            display: flex;
            gap: 10px;
            opacity: 0.3; /* จางๆ เมื่อไม่ได้ชี้เมาส์ */
            transition: opacity 0.3s ease;
        }
        #video-area:hover #video-controls {
            opacity: 1; /* เข้มขึ้นเมื่อเอาเมาส์ชี้ไปที่วิดีโอ */
        }
        .v-btn {
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 0.9rem;
            cursor: pointer;
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: "Sarabun", sans-serif;
            transition: 0.2s;
        }
        .v-btn:hover {
            background: rgba(20, 184, 177, 0.8);
            border-color: #14b8b1;
        }
        .quality-dropdown {
            position: absolute;
            bottom: 120%;
            right: 0;
            background: rgba(0,0,0,0.8);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            display: none;
            flex-direction: column;
            overflow: hidden;
            min-width: 110px;
        }
        .quality-dropdown button {
            background: transparent;
            color: #fff;
            border: none;
            padding: 10px 16px;
            text-align: left;
            cursor: pointer;
            font-size: 0.9rem;
            font-family: "Sarabun", sans-serif;
        }
        .quality-dropdown button:hover {
            background: rgba(20, 184, 177, 0.5);
        }

        /* Below-video slide panel */
        #sec-video-bottom {
            flex: 1;
            min-height: 0;
            position: relative;
            background: #020617;
            overflow: hidden;
        }
        .vb-slide-item {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.8s ease;
            overflow: hidden;
        }
        .vb-slide-item.active { opacity: 1; z-index: 1; }
        .vb-slide-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .vb-slide-text {
            font-size: clamp(1rem, 3.5vw, 2.8rem);
            font-weight: 800;
            color: #14b8b1;
            text-align: center;
            padding: 16px 24px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }
        #video-bottom-placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: #1e293b;
        }
        #video-bottom-placeholder .icon { font-size: 2rem; }
        #video-bottom-placeholder .msg { font-size: 0.85rem; font-weight: 600; }

        /* Section 2 – Slideshow */
        #sec-slideshow {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: #0f172a;
        }
        .slide-item {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.8s ease;
            overflow: hidden;
        }
        .slide-item.active { opacity: 1; z-index: 1; }
        .slide-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .slide-text-wrap {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 32px;
            text-align: center;
        }
        .slide-text-wrap .slide-title {
            font-size: clamp(1.2rem, 3vw, 2.4rem);
            font-weight: 800;
            color: #14b8b1;
            margin-bottom: 12px;
            line-height: 1.3;
        }
        .slide-text-wrap .slide-subtitle {
            font-size: clamp(0.9rem, 2vw, 1.5rem);
            color: #cbd5e1;
            line-height: 1.6;
        }
        #slide-dots {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            z-index: 10;
        }
        .slide-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
            transition: background 0.3s;
        }
        .slide-dot.active { background: #14b8b1; }
        #slideshow-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: #334155;
        }
        #slideshow-placeholder .icon { font-size: 3rem; }
        #slideshow-placeholder .msg { font-size: 1rem; font-weight: 600; }

        /* Ticker */
        #row-ticker {
            flex: 0 0 14%;
            min-height: 0;
            display: flex;
            align-items: center;
            background: linear-gradient(90deg, #0d9488 0%, #0f172a 30%, #0f172a 70%, #0d9488 100%);
            overflow: hidden;
            position: relative;
            border-top: 2px solid #14b8b1;
        }
        #ticker-track {
            display: flex;
            align-items: center;
            white-space: nowrap;
            animation: ticker-scroll linear infinite;
            font-size: clamp(1rem, 2.5vh, 1.6rem);
            font-weight: 700;
            color: #e2e8f0;
            padding-right: 80px;
        }
        #ticker-track .ticker-sep {
            display: inline-block;
            margin: 0 48px;
            color: #14b8b1;
            font-size: 1.5em;
        }
        @keyframes ticker-scroll {
            0%   { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        #ticker-placeholder {
            width: 100%;
            text-align: center;
            color: #334155;
            font-size: 1rem;
            font-weight: 600;
        }

        #row-top { border-bottom: 2px solid #020617; }
    </style>
</head>
<body>

<div id="signage-root">
    <div id="row-top">

        <!-- Section 1: Video -->
        <div id="sec-video">
            <div id="video-area">
                <div id="video-placeholder">
                    <div class="icon">🎬</div>
                    <div class="msg">ยังไม่ได้ตั้งค่า URL วิดีโอ</div>
                </div>

                <!-- Video Controls (Mute & Quality) -->
                <div id="video-controls" style="display: none;">
                    <button class="v-btn" id="btn-mute" onclick="toggleMute()" title="เปิด/ปิดเสียง">
                        <span id="mute-icon">🔇</span>
                    </button>
                    
                    <div style="position: relative;">
                        <button class="v-btn" id="btn-quality" onclick="toggleQualityMenu()" title="ความละเอียด">
                            ⚙️ <span id="quality-label">Auto</span>
                        </button>
                        <!-- Quality Menu -->
                        <div id="quality-menu" class="quality-dropdown">
                            <button onclick="setQuality('1080p')">1080p</button>
                            <button onclick="setQuality('720p')">720p</button>
                            <button onclick="setQuality('480p')">480p</button>
                            <button onclick="setQuality('Auto')">Auto</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Remaining space below video -->
            <div id="sec-video-bottom">
                <div id="video-bottom-placeholder">
                    <div class="icon">🖼️</div>
                    <div class="msg">ยังไม่ได้ตั้งค่ารูปภาพ</div>
                </div>
            </div>
        </div>

        <!-- Section 2: Slideshow -->
        <div id="sec-slideshow">
            <div id="slideshow-placeholder">
                <div class="icon">🖼️</div>
                <div class="msg">ยังไม่ได้เพิ่มสไลด์</div>
            </div>
            <div id="slide-dots"></div>
        </div>

    </div>

    <!-- Row 2: Ticker (bottom) -->
    <div id="row-ticker">
        <div id="ticker-placeholder">ยังไม่ได้ตั้งค่าข้อความวิ่ง</div>
        <div id="ticker-track" style="display:none;"></div>
    </div>
</div>

<script>
// ==========================================
//  signage.html Config
// ==========================================
function getConfig() {
    try { return JSON.parse(localStorage.getItem("signageCfg") || "{}"); } catch(e) { return {}; }
}
async function getConfigFromSupabase() {
    try {
        const { data } = await db.from('app_settings').select('value').eq('key', 'signageCfg').maybeSingle();
        if (data?.value) return data.value;
    } catch(e) { console.warn('Supabase load error:', e); }
    return null;
}

// ---- IndexedDB helpers ----
function openSignageDB() {
    return new Promise((resolve, reject) => {
        const req = indexedDB.open("signageDB", 1);
        req.onupgradeneeded = e => e.target.result.createObjectStore("videoStore");
        req.onsuccess = e => resolve(e.target.result);
        req.onerror   = e => reject(e.target.error);
    });
}
function loadVideoDB() {
    return openSignageDB().then(idb => new Promise((resolve, reject) => {
        const tx  = idb.transaction("videoStore", "readonly");
        const req = tx.objectStore("videoStore").get("videoUpload");
        req.onsuccess = e => resolve(e.target.result || null);
        req.onerror   = e => reject(e.target.error);
    }));
}

// ---- Video Controls Logic ----
let isVideoMuted = true;

function toggleMute() {
    isVideoMuted = !isVideoMuted;
    document.getElementById("mute-icon").textContent = isVideoMuted ? "🔇" : "🔊";

    const videoArea = document.getElementById("video-area");
    const htmlVideo = videoArea.querySelector("video");
    const ytIframe = videoArea.querySelector("iframe");

    if (htmlVideo) {
        htmlVideo.muted = isVideoMuted;
    } else if (ytIframe) {
        // ใช้ PostMessage สั่งงาน YouTube Iframe
        const command = isVideoMuted ? 'mute' : 'unMute';
        ytIframe.contentWindow.postMessage(JSON.stringify({ event: 'command', func: command, args: [] }), '*');
    }
}

function toggleQualityMenu() {
    const menu = document.getElementById('quality-menu');
    menu.style.display = (menu.style.display === 'flex') ? 'none' : 'flex';
}

function setQuality(quality) {
    document.getElementById('quality-label').textContent = quality;
    document.getElementById('quality-menu').style.display = 'none';

    const videoArea = document.getElementById("video-area");
    const ytIframe = videoArea.querySelector("iframe");
    
    // ส่งคำสั่งปรับความละเอียดไปที่ YouTube (ถ้าเป็น HTML5 วิดีโอไฟล์เดียว จะไม่สามารถสลับได้)
    if (ytIframe) {
        let ytQuality = 'default';
        if(quality === '1080p') ytQuality = 'hd1080';
        if(quality === '720p') ytQuality = 'hd720';
        if(quality === '480p') ytQuality = 'large';
        
        ytIframe.contentWindow.postMessage(JSON.stringify({ event: 'command', func: 'setPlaybackQuality', args: [ytQuality] }), '*');
    }
}

// ---- Section 1: Video ----
let _signageVideoObjectURL = null;

function initVideo(cfg) {
    const mode = cfg.videoMode || "url";
    const container = document.getElementById("video-area");
    const controls = document.getElementById("video-controls");

    if (mode === "upload") {
        const src = (cfg.videoSrc || "").trim();
        if (!src) return;

        if (src === "__indexeddb__") {
            loadVideoDB().then(blob => {
                if (!blob) return;
                document.getElementById("video-placeholder").style.display = "none";
                const video = document.createElement("video");
                _signageVideoObjectURL = URL.createObjectURL(blob);
                video.src = _signageVideoObjectURL;
                video.autoplay = true;
                video.muted = isVideoMuted;
                video.loop = true;
                video.playsInline = true;
                video.controls = false;
                // วางวิดีโอไว้ก่อนปุ่ม controls
                container.insertBefore(video, controls);
                controls.style.display = "flex";
            }).catch(err => console.warn("IndexedDB load error:", err));
            return;
        }

        if (!src.startsWith("data:video/")) return;
        document.getElementById("video-placeholder").style.display = "none";
        const video = document.createElement("video");
        video.src = src;
        video.autoplay = true;
        video.muted = isVideoMuted;
        video.loop = true;
        video.playsInline = true;
        video.controls = false;
        container.insertBefore(video, controls);
        controls.style.display = "flex";
        return;
    }

    const url = (cfg.videoUrl || "").trim();
    if (!url) return;

    document.getElementById("video-placeholder").style.display = "none";

    const ytMatch = url.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|v\/|shorts\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/);
    if (ytMatch) {
        const iframe = document.createElement("iframe");
        // เพิ่ม &enablejsapi=1 เพื่อให้ปุ่มเราส่งคำสั่งไปควบคุมวิดีโอ YouTube ได้
        iframe.src = `https://www.youtube.com/embed/${ytMatch[1]}?autoplay=1&mute=${isVideoMuted ? 1 : 0}&loop=1&playlist=${ytMatch[1]}&controls=0&modestbranding=1&enablejsapi=1`;
        iframe.allow = "autoplay; fullscreen";
        iframe.allowFullscreen = true;
        container.insertBefore(iframe, controls);
        controls.style.display = "flex";
        return;
    }

    const video = document.createElement("video");
    video.src = url;
    video.autoplay = true;
    video.muted = isVideoMuted;
    video.loop = true;
    video.playsInline = true;
    video.controls = false;
    container.insertBefore(video, controls);
    controls.style.display = "flex";
}

// ---- Section 1b: Below-video slideshow ----
let vbSlideIndex = 0;
let vbSlideTimer = null;
function initVideoBottomSlide(cfg) {
    const slides = cfg.videoBottomSlides || [];
    const interval = (cfg.videoBottomInterval || 5) * 1000;
    const container = document.getElementById("sec-video-bottom");

    if (!slides.length) {
        const src = (cfg.videoBottomSrc || "").trim();
        if (src) {
            document.getElementById("video-bottom-placeholder").style.display = "none";
            const item = document.createElement("div");
            item.className = "vb-slide-item active";
            const img = document.createElement("img");
            img.src = src;
            item.appendChild(img);
            container.appendChild(item);
        }
        return;
    }

    document.getElementById("video-bottom-placeholder").style.display = "none";
    slides.forEach((s, i) => {
        const el = document.createElement("div");
        el.className = "vb-slide-item" + (i === 0 ? " active" : "");
        if (s.type === "image" || s.type === "upload") {
            el.style.background = "#000";
            const img = document.createElement("img");
            img.src = s.src || s.url || "";
            el.appendChild(img);
        } else {
            el.style.background = s.bg || "linear-gradient(135deg,#020617 0%,#0f172a 100%)";
            const textEl = document.createElement("div");
            textEl.className = "vb-slide-text";
            textEl.style.color = s.textColor || "#14b8b1";
            if (s.textSize) textEl.style.fontSize = s.textSize + "px";
            textEl.textContent = s.text || "";
            el.appendChild(textEl);
        }
        container.appendChild(el);
    });

    if (slides.length <= 1) return;
    function nextVBSlide() {
        const items = container.querySelectorAll(".vb-slide-item");
        items.forEach((el, i) => el.classList.toggle("active", i === ((vbSlideIndex + 1) % items.length)));
        vbSlideIndex = (vbSlideIndex + 1) % items.length;
    }
    vbSlideTimer = setInterval(nextVBSlide, interval);
}

// ---- Section 2: Slideshow ----
let slideIndex = 0;
let slideTimer = null;
function initSlideshow(cfg) {
    const slides = cfg.slides || [];
    const interval = (cfg.slideInterval || 5) * 1000;
    const container = document.getElementById("sec-slideshow");
    const dotsContainer = document.getElementById("slide-dots");

    if (!slides.length) return;
    document.getElementById("slideshow-placeholder").remove();

    slides.forEach((s, i) => {
        const el = document.createElement("div");
        el.className = "slide-item" + (i === 0 ? " active" : "");
        if (s.type === "image" || s.type === "upload") {
            const img = document.createElement("img");
            img.src = s.src || s.url || "";
            el.appendChild(img);
        } else {
            const wrap = document.createElement("div");
            wrap.className = "slide-text-wrap";
            const title = document.createElement("div");
            title.className = "slide-title";
            title.style.color = s.titleColor || "#14b8b1";
            if (s.titleSize) title.style.fontSize = s.titleSize + "px";
            title.textContent = s.title || "";
            wrap.appendChild(title);
            if (s.subtitle) {
                const sub = document.createElement("div");
                sub.className = "slide-subtitle";
                sub.style.color = s.subtitleColor || "#cbd5e1";
                if (s.subtitleSize) sub.style.fontSize = s.subtitleSize + "px";
                const lines = (s.subtitle || "").split(/\\n/);
                lines.forEach((line, li) => {
                    if (li > 0) sub.appendChild(document.createElement("br"));
                    sub.appendChild(document.createTextNode(line));
                });
                wrap.appendChild(sub);
            }
            el.style.background = s.bg || "linear-gradient(135deg,#020617 0%,#0f172a 100%)";
            el.appendChild(wrap);
        }
        container.appendChild(el);
        const dot = document.createElement("div");
        dot.className = "slide-dot" + (i === 0 ? " active" : "");
        dotsContainer.appendChild(dot);
    });

    function nextSlide() {
        const items = container.querySelectorAll(".slide-item");
        const dots  = dotsContainer.querySelectorAll(".slide-dot");
        const nIdx = (slideIndex + 1) % items.length;
        items.forEach((el, i) => el.classList.toggle("active", i === nIdx));
        dots.forEach((d, i)  => d.classList.toggle("active", i === nIdx));
        slideIndex = nIdx;
    }
    slideTimer = setInterval(nextSlide, interval);
}

// ---- Section 3: Ticker ----
function initTicker(cfg) {
    const text = (cfg.tickerText || "").trim();
    const speed = cfg.tickerSpeed || 60; 
    if (!text) return;
    document.getElementById("ticker-placeholder").style.display = "none";
    const track = document.getElementById("ticker-track");
    track.style.display = "flex";
    const fontSize = parseInt(cfg.tickerFontSize) || 28;
    const fontStyleStr = cfg.tickerFontStyle || "normal";
    track.style.fontSize = fontSize + "px";
    track.style.color = cfg.tickerColor || "#e2e8f0";
    track.style.fontFamily = cfg.tickerFontFamily || "Sarabun, sans-serif";
    track.style.fontWeight = fontStyleStr.includes("bold") ? "bold" : "normal";
    track.style.fontStyle  = fontStyleStr.includes("italic") ? "italic" : "normal";
    function makeSep() { const s = document.createElement("span"); s.className = "ticker-sep"; s.textContent = "◆"; return s; }
    function makeTextSpan(t) { const s = document.createElement("span"); s.textContent = t; return s; }
    for (let i = 0; i < 4; i++) {
        track.appendChild(makeTextSpan(text));
        track.appendChild(makeSep());
    }
    const duration = Math.max(8, Math.round((window.innerWidth * 2) / speed));
    track.style.animationDuration = duration + "s";
}

// ---- Boot ----
async function boot() {
    const cfgLocal = getConfig();
    initVideo(cfgLocal);
    initVideoBottomSlide(cfgLocal);
    initSlideshow(cfgLocal);
    initTicker(cfgLocal);
    if (sessionStorage.getItem('_supabase_boot')) {
        sessionStorage.removeItem('_supabase_boot');
        return;
    }
    const cfgSupabase = await getConfigFromSupabase();
    if (cfgSupabase && JSON.stringify(cfgSupabase) !== JSON.stringify(cfgLocal)) {
        const localTime = cfgLocal.savedAt || 0;
        const supabaseTime = cfgSupabase.savedAt || 0;
        if (supabaseTime >= localTime) {
            localStorage.setItem('signageCfg', JSON.stringify(cfgSupabase));
            sessionStorage.setItem('_supabase_boot', '1');
            window.location.reload();
        }
    }
}

window.addEventListener("storage", (e) => {
    if (e.key === "signageCfg") window.location.reload();
});

window.addEventListener("pagehide", () => {
    if (_signageVideoObjectURL) {
        URL.revokeObjectURL(_signageVideoObjectURL);
        _signageVideoObjectURL = null;
    }
});

// Click outside quality menu to close
document.addEventListener("click", function(event) {
    const menu = document.getElementById('quality-menu');
    const btn = document.getElementById('btn-quality');
    if (menu && menu.style.display === 'flex') {
        if (!menu.contains(event.target) && !btn.contains(event.target)) {
            menu.style.display = 'none';
        }
    }
});

window.addEventListener("DOMContentLoaded", boot);
</script>
</body>
</html>
